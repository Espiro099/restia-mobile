name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Pruebas y lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Caché de Gradle y de sus dependencias entre ejecuciones.
      - uses: gradle/actions/setup-gradle@v4

      # El SDK de Android ya viene en ubuntu-latest con las licencias aceptadas;
      # AGP descarga la plataforma 37 si falta. Sin local.properties, la URL de la
      # API cae en el valor por omisión, que las pruebas no usan.
      - name: Pruebas unitarias y lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
