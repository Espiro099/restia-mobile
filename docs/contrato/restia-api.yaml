      - name: to
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: entityType
        in: query
        required: false
        schema:
          type: string
          maxLength: 60
      - name: entityId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: actorId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: action
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
      responses:
        '200':
          description: Entradas
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
