      security:
      - SessionCookie: []
      x-restia:
        actors:
        - ADMIN
        branch: No aplica; eventos globales
        permission: audit.read_global
        requiredState: Ninguno
        idempotent: Sí, operación de lectura
        requiresVersion: false
        concurrency: No aplica
        audit: false
        outbox: false
        mode: Síncrono
        sensitive: Actores y valores enmascarados
        clients:
        - Web
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: from
