      security:
      - SessionCookie: []
      x-restia:
        actors:
        - ADMIN
        - MANAGER
        branch: Explícita en la ruta
        permission: audit.read
        requiredState: Ninguno
        idempotent: Sí, operación de lectura
        requiresVersion: false
        concurrency: No aplica
        audit: false
        outbox: false
        mode: Síncrono
        sensitive: Actores y valores enmascarados
