      - name: to
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: entityType
        in: query
        required: false
        schema:
          type: string
          maxLength: 60
      - name: entityId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: actorId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: action
