openapi: 3.0.3
info:
  title: Restia API
  description: 'Contrato de Restia. Módulos especificados: Authentication, Devices, Branches, Tables,
    Table Sessions, Reservations, Menu, Orders, Checks, Payments, Inventory, Cash, Fiscal, Printing, Public
    QR, IA, Users, Customers, Reports y Audit. La extensión x-restia responde los criterios de la sección
    36 del documento maestro que no se expresan con OpenAPI estándar.

    '
  version: 1.0.0
servers:
- url: https://api.restia.com/api/v1
  description: Producción
- url: https://api-dev.restia.com/api/v1
  description: Desarrollo
tags:
- name: Authentication
  description: Inicio de sesión, renovación y revocación
- name: Devices
  description: Alta, consulta y baja de dispositivos Android
- name: Branches
  description: Consulta y administración de sucursales
- name: Tables
  description: Mesas físicas y su estado operativo derivado
- name: Table Sessions
  description: Apertura, asignación, separación, cierre y limpieza
- name: Reservations
  description: Disponibilidad, reservas, llegada y check-in
- name: Menu
  description: Estaciones, modificadores, productos, rutas y recetas
- name: Orders
  description: Comandas, partidas y unidades
- name: Checks
  description: Cuentas, división, cortesías y totales
- name: Payments
  description: Pagos, reconciliación y reembolsos
- name: Inventory
  description: Ingredientes, movimientos, recepciones y conteos
- name: Cash
  description: Cajas, turnos, movimientos y cierre
- name: Fiscal
  description: Emisores, facturas, cancelación, egresos, complementos y factura global
- name: Printing
  description: Impresoras, rutas, agentes y trabajos de impresión
- name: Public QR
  description: Experiencia pública de la mesa
- name: Users
  description: Empleados y membresías
- name: Customers
  description: Clientes por sucursal
- name: Reports
  description: Proyecciones de ventas y ocupación
- name: Audit
  description: Consulta de auditoría
security:
- BearerAuth: []
paths:
  /sanctum/csrf-cookie:
    servers:
    - url: https://api.restia.com
      description: Producción, fuera de /api/v1
    - url: https://api-dev.restia.com
      description: Desarrollo, fuera de /api/v1
    get:
      tags:
      - Authentication
      operationId: getCsrfCookie
      summary: Emite la cookie XSRF-TOKEN para Web
      security: []
      x-restia:
        actors:
        - Visitante Web
        branch: No aplica
        permission: Ninguno
        requiredState: Ninguno
        idempotent: Sí, operación de lectura
        requiresVersion: false
        concurrency: No aplica
        audit: false
        outbox: false
        mode: Síncrono
        sensitive: Token CSRF
        clients:
        - Web
      responses:
        '204':
          description: Cookie emitida
          headers:
            Set-Cookie:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags:
      - Authentication
      operationId: loginWeb
      summary: Inicia una sesión Web
      security: []
      x-restia:
        actors:
        - Empleado
        branch: Global; las sucursales se obtienen de sus membresías
        permission: Usuario activo
        requiredState: Usuario activo
        idempotent: false
        requiresVersion: false
        concurrency: Si excede 3 sesiones Web, se revoca la más antigua
        audit: Login correcto y bloqueo por intentos
        outbox: false
        mode: Síncrono
        sensitive: Contraseña y cookie de sesión
        clients:
        - Web
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/XsrfTokenRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebLoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              schema:
                type: string
              description: laravel_session con HttpOnly, Secure y SameSite=Lax
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/mobile/enroll:
    post:
      tags:
      - Authentication
      operationId: enrollMobileDevice
      summary: Registra un dispositivo Android con un código de alta
      description: 'La credencial se devuelve una sola vez. Si la respuesta se pierde, se requiere un
        código nuevo y otro deviceUuid.

        '
      security: []
      x-restia:
        actors:
        - Dispositivo con código de alta
        branch: La determina el código
        permission: Código vigente de un solo uso
        requiredState: Código sin usar y sin vencer
        idempotent: No; el código solo admite un uso
        requiresVersion: false
        concurrency: Consumo atómico del código; solo una petición gana
        audit: Alta de dispositivo
        outbox: device.enrolled
        mode: Síncrono, en transacción
        sensitive: Código de alta y credencial del dispositivo
        clients:
        - Android
        conflictCodes:
        - DEVICE_ALREADY_ENROLLED
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceEnrollRequest'
      responses:
        '201':
          description: Dispositivo registrado
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceEnrollResponse'
        '401':
          $ref: '#/components/responses/EnrollmentCodeInvalid'
        '409':
          $ref: '#/components/responses/DeviceAlreadyEnrolled'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceBusy'
  /auth/mobile/login:
    post:
      tags:
      - Authentication
      operationId: loginMobile
      summary: Inicia sesión en un dispositivo registrado
      security: []
      x-restia:
        actors:
        - Empleado
        branch: La del dispositivo; exige membresía activa
        permission: Membresía activa en la sucursal del dispositivo
        requiredState: Usuario activo y dispositivo ACTIVE
        idempotent: false
        requiresVersion: false
        concurrency: 'Índice único de sesión activa por dispositivo; la anterior se revoca. Si excede
          2 sesiones Android, se revoca la más antigua.

          '
        audit: Login correcto, sesiones revocadas y bloqueo por intentos
        outbox: false
        mode: Síncrono, en transacción
        sensitive: Contraseña, credencial del dispositivo y tokens
        clients:
        - Android
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileLoginRequest'
      responses:
        '201':
          description: Sesión creada
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/DeviceOrBranchDenied'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceBusy'
  /auth/mobile/refresh:
    post:
      tags:
      - Authentication
      operationId: refreshMobileSession
      summary: Rota el refresh token y emite un access token nuevo
      security: []
      x-restia:
        actors:
        - Sesión Android
        branch: No aplica
        permission: Refresh token vigente
        requiredState: Sesión ACTIVE y dispositivo ACTIVE
        idempotent: No usa Idempotency-Key; la gracia de 60 s cubre los reintentos
        requiresVersion: false
        concurrency: findOneAndUpdate atómico sobre el hash vigente o el anterior
        audit: Solo cuando se detecta reúso
        outbox: false
        mode: Síncrono, en transacción
        sensitive: Tokens
        clients:
        - Android
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRefreshRequest'
      responses:
        '200':
          description: Tokens renovados
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenResponse'
        '401':
          $ref: '#/components/responses/SessionRevoked'
        '403':
          $ref: '#/components/responses/DeviceBlocked'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceBusy'
  /auth/logout:
    post:
      tags:
      - Authentication
      operationId: logout
      summary: Cierra la sesión actual
      security:
      - BearerAuth: []
      - SessionCookie: []
      x-restia:
        actors:
        - Empleado autenticado
        branch: No aplica
        permission: Ninguno
        requiredState: Sesión ACTIVE
        idempotent: Sí, en efecto
        requiresVersion: false
        concurrency: La revocación siempre gana
        audit: Logout
        outbox: false
        mode: Síncrono, en transacción
        sensitive: Credencial de la sesión
        clients:
        - Android
        - Web
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/XsrfTokenWeb'
      responses:
        '204':
          description: Sesión cerrada
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfMismatch'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceBusy'
  /auth/me:
    get:
      tags:
      - Authentication
      operationId: getCurrentUser
      summary: Devuelve el usuario, sus membresías y permisos
      description: 'El cliente puede usar los permisos para la interfaz, pero el backend siempre los valida.

        '
      security:
      - BearerAuth: []
      - SessionCookie: []
      x-restia:
        actors:
        - Empleado autenticado
        branch: Todas sus membresías activas
        permission: Ninguno
        requiredState: Sesión ACTIVE
        idempotent: Sí, operación de lectura
        requiresVersion: false
        concurrency: No aplica
        audit: false
        outbox: false
        mode: Síncrono
        sensitive: Datos del empleado
        clients:
        - Android
        - Web
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Contexto del usuario
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/sessions:
    get:
      tags:
      - Authentication
      operationId: listOwnSessions
      summary: Lista las sesiones del usuario actual
      security:
      - BearerAuth: []
      - SessionCookie: []
      x-restia:
        actors:
        - Empleado autenticado
        branch: No aplica
        permission: Solo sesiones propias
        requiredState: Sesión ACTIVE
        idempotent: Sí, operación de lectura
        requiresVersion: false
        concurrency: No aplica
        audit: false
        outbox: false
        mode: Síncrono
        sensitive: Actividad y dispositivos del usuario
        clients:
        - Android
        - Web
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AuthSessionStatus'
      responses:
        '200':
          description: Sesiones del usuario
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/sessions/{sessionId}/revoke:
    post:
      tags:
      - Authentication
      operationId: revokeOwnSession
      summary: Cierra una sesión propia
      security:
      - BearerAuth: []
      - SessionCookie: []
      x-restia:
        actors:
        - Dueño de la sesión
        branch: No aplica
        permission: Solo sesiones propias; una ajena responde 404
        requiredState: Cualquiera; si ya está cerrada no hay cambios
        idempotent: Sí, en efecto
        requiresVersion: false
        concurrency: La revocación siempre gana
        audit: Revocación
        outbox: false
        mode: Síncrono, en transacción
        sensitive: Actividad del usuario
        clients:
        - Android
        - Web
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/XsrfTokenWeb'
      - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Sesión cerrada
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfMismatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceBusy'
  /users/{userId}/sessions/revoke:
    post:
      tags:
      - Authentication
      operationId: revokeUserSessions
      summary: Revoca todas las sesiones de un usuario
      description: 'Regla A-10. Exige el permiso en al menos una sucursal donde el usuario objetivo tenga
        membresía. La revocación alcanza todas sus sesiones.

        '
      security:
      - SessionCookie: []
      x-restia:
        actors:
        - ADMIN
        branch: Al menos una sucursal donde el usuario objetivo tenga membresía
        permission: users.sessions.revoke
        requiredState: Cualquiera; si no hay sesiones activas no hay cambios
        idempotent: Sí, en efecto
        requiresVersion: false
        concurrency: La revocación siempre gana
        audit: Revocación con actor y motivo
        outbox: user.sessions_revoked
        mode: Síncrono, en transacción
        sensitive: Motivo de la revocación
        clients:
        - Web
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/XsrfTokenWeb'
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '204':
          description: Sesiones revocadas
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceBusy'
  /branches/{branchId}/devices/enrollment-codes:
    post:
      tags:
      - Devices
      operationId: createEnrollmentCode
      summary: Genera un código de alta de un solo uso
      security:
      - BearerAuth: []
      - SessionCookie: []
      x-restia:
        actors:
        - ADMIN
        - MANAGER
        branch: Explícita en la ruta
        permission: devices.enroll
        requiredState: Sucursal activa
        idempotent: No; cada petición genera un código distinto
        requiresVersion: false
        concurrency: Sin conflicto; los códigos son independientes
        audit: Emisión del código, sin su valor
        outbox: false
        mode: Síncrono
        sensitive: Código de alta, mostrado una sola vez
        clients:
        - Android
        - Web
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/XsrfTokenWeb'
      - $ref: '#/components/parameters/BranchId'
      responses:
        '201':
          description: Código generado
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentCodeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'
  /branches/{branchId}/devices:
    get:
      tags:
      - Devices
      operationId: listDevices
      summary: Lista los dispositivos de la sucursal
      security:
      - BearerAuth: []
      - SessionCookie: []
      x-restia:
        actors:
        - ADMIN
        - MANAGER
        branch: Explícita en la ruta
        permission: devices.read
        requiredState: Ninguno
        idempotent: Sí, operación de lectura
        requiresVersion: false
        concurrency: No aplica
        audit: false
        outbox: false
        mode: Síncrono
        sensitive: Inventario de dispositivos
        clients:
        - Android
        - Web
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DeviceStatus'
      responses:
        '200':
          description: Dispositivos de la sucursal
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /branches/{branchId}/devices/{deviceId}/block:
    post:
      tags:
      - Devices
      operationId: blockDevice
      summary: Bloquea un dispositivo y revoca sus sesiones
      description: Para pérdida o robo. BLOCKED es final; repetir la operación no cambia nada.
      security:
      - BearerAuth: []
      - SessionCookie: []
      x-restia:
        actors:
        - ADMIN
        - MANAGER
        branch: Explícita en la ruta
        permission: devices.manage
        requiredState: ACTIVE; en BLOCKED o RETIRED no hay cambios
        idempotent: Sí, en efecto
        requiresVersion: false
        concurrency: La revocación siempre gana; no usa If-Match
        audit: Bloqueo y sesiones revocadas, con actor y motivo
        outbox: device.blocked
        mode: Síncrono, en transacción
        sensitive: Motivo del bloqueo
        clients:
        - Android
        - Web
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/XsrfTokenWeb'
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '204':
          description: Dispositivo bloqueado
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceBusy'
  /branches/{branchId}/devices/{deviceId}/retire:
    post:
      tags:
      - Devices
      operationId: retireDevice
      summary: Retira un dispositivo y revoca sus sesiones
      description: Para baja planificada. RETIRED es final; un dispositivo BLOCKED conserva su estado.
      security:
      - BearerAuth: []
      - SessionCookie: []
      x-restia:
        actors:
        - ADMIN
        - MANAGER
        branch: Explícita en la ruta
        permission: devices.manage
        requiredState: ACTIVE; en BLOCKED o RETIRED no hay cambios
        idempotent: Sí, en efecto
        requiresVersion: false
        concurrency: La revocación siempre gana; no usa If-Match
        audit: Retiro y sesiones revocadas, con actor y motivo
        outbox: device.retired
        mode: Síncrono, en transacción
        sensitive: Motivo del retiro
        clients:
        - Android
        - Web
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/XsrfTokenWeb'
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '204':
          description: Dispositivo retirado
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceBusy'
  /branches:
    get:
      tags:
      - Branches
      operationId: listBranches
      summary: Lista las sucursales visibles para el usuario
      description: 'Devuelve las sucursales con membresía activa. En Android, solo la sucursal del dispositivo.

        '
      security:
      - BearerAuth: []
      - SessionCookie: []
      x-restia:
        actors:
        - Empleado autenticado
        branch: Filtrada por membresía
        permission: Membresía activa
        requiredState: Ninguno
        idempotent: Sí, operación de lectura
        requiresVersion: false
        concurrency: No aplica
        audit: false
        outbox: false
        mode: Síncrono
        sensitive: Ninguno
        clients:
        - Android
        - Web
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/BranchStatus'
      responses:
