          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    SessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
    ServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    PublicQrToken:
      type: apiKey
      in: header
      name: X-QR-Token
  headers:
    XRequestId:
      description: Identificador de la petición; el servidor lo genera si no se envía
      schema:
        $ref: '#/components/schemas/Uuid'
    NoStore:
      description: Impide guardar la respuesta en caché
      schema:
        type: string
        enum:
        - no-store
    RetryAfter:
      description: Segundos que el cliente debe esperar
      schema:
        type: integer
        minimum: 1
    ETag:
      description: Versión del recurso, por ejemplo "8"
      schema:
        type: string
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Versión conocida por el cliente, por ejemplo "8"
      schema:
        type: string
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/Uuid'
    XsrfTokenRequired:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Token CSRF de la cookie XSRF-TOKEN
      schema:
        type: string
    XsrfTokenWeb:
      name: X-XSRF-TOKEN
      in: header
      required: false
      description: Obligatorio con SessionCookie; no aplica con BearerAuth
      schema:
        type: string
    BranchId:
      name: branchId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: Valor de device_uuid
      schema:
        $ref: '#/components/schemas/Uuid'
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    TableId:
      name: tableId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TableSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    StationId:
      name: stationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ModifierId:
      name: modifierId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RecipeVersion:
      name: recipeVersion
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    OrderItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    OrderUnitId:
      name: unitId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ApprovalToken:
      name: X-Approval-Token
      in: header
      required: false
      description: Token de un solo uso emitido por createApproval
      schema:
        type: string
    CheckId:
      name: checkId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AdjustmentId:
      name: adjustmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RefundId:
      name: refundId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IngredientId:
      name: ingredientId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CountId:
      name: countId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CashRegisterId:
      name: cashRegisterId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CashShiftId:
      name: cashShiftId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    FiscalIssuerId:
      name: fiscalIssuerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    InvoiceBatchId:
      name: batchId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ComplementId:
      name: complementId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PrinterId:
      name: printerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PrintStationId:
      name: printStationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PrintAgentId:
      name: printAgentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PrintJobId:
      name: printJobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PrintAttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ServiceIdentityId:
      name: serviceIdentityId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ConversationId:
      name: X-Conversation-Id
      in: header
      required: false
      description: Referencia de la conversación, solo para reservation-ai. No debe contener datos personales.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,64}$
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ReportRebuildId:
      name: rebuildId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  responses:
    InvalidCredentials:
      description: Credenciales inválidas; el mensaje no revela qué dato falló
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            authenticationInvalid:
              value:
                error:
                  code: AUTHENTICATION_INVALID
                  message: Las credenciales no son válidas.
                  requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
            deviceNotEnrolled:
              value:
                error:
                  code: DEVICE_NOT_ENROLLED
                  message: El dispositivo no está registrado.
                  requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
    Unauthenticated:
      description: Falta la credencial, es inválida o ya venció
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTHENTICATION_REQUIRED
              message: Se requiere autenticación.
              requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
    SessionRevoked:
      description: Renovación rechazada; requiere iniciar sesión
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: SESSION_REVOKED
              message: La sesión ya no es válida. Inicia sesión de nuevo.
              requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
    EnrollmentCodeInvalid:
      description: Código vencido, usado o incorrecto
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: ENROLLMENT_CODE_INVALID
              message: El código de alta no es válido.
              requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
    DeviceAlreadyEnrolled:
      description: El deviceUuid ya existe
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: DEVICE_ALREADY_ENROLLED
              message: Este dispositivo ya está registrado.
              requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
    DeviceBlocked:
      description: Dispositivo bloqueado o retirado; el cliente borra sus datos locales
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: DEVICE_BLOCKED
              message: Este dispositivo ya no está autorizado.
              requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
    DeviceOrBranchDenied:
      description: Dispositivo no activo o usuario sin membresía en su sucursal
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            deviceBlocked:
              value:
                error:
                  code: DEVICE_BLOCKED
                  message: Este dispositivo ya no está autorizado.
                  requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
            branchAccessDenied:
              value:
                error:
                  code: BRANCH_ACCESS_DENIED
                  message: No tienes acceso a esta sucursal.
                  requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
    Forbidden:
      description: Sin permiso, sin membresía, dispositivo de otra sucursal o CSRF inválido
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                error:
                  code: FORBIDDEN
                  message: No tienes permiso para esta operación.
                  requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
            branchAccessDenied:
              value:
                error:
                  code: BRANCH_ACCESS_DENIED
                  message: No tienes acceso a esta sucursal.
                  requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
            deviceBranchMismatch:
              value:
                error:
                  code: DEVICE_BRANCH_MISMATCH
                  message: Este dispositivo pertenece a otra sucursal.
                  requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
            csrfMismatch:
              value:
                error:
                  code: CSRF_TOKEN_MISMATCH
                  message: La página expiró. Recárgala e inténtalo de nuevo.
                  requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
    CsrfMismatch:
      description: Token CSRF ausente o inválido en una sesión Web
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CSRF_TOKEN_MISMATCH
              message: La página expiró. Recárgala e inténtalo de nuevo.
              requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
    NotFound:
      description: El recurso no existe o no es visible para el usuario
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: El recurso no existe.
              requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
    ValidationFailed:
      description: Datos inválidos
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_FAILED
              message: Los datos enviados no son válidos.
              details:
                fields:
                  email:
                  - El correo no tiene un formato válido.
              requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
    TooManyAttempts:
      description: Demasiados intentos
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: TOO_MANY_ATTEMPTS
              message: Demasiados intentos. Espera antes de reintentar.
              requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
    InternalError:
      description: Error interno
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: Ocurrió un error inesperado.
              requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
    VersionRequired:
      description: Falta el header If-Match
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VERSION_REQUIRED
              message: Esta operación requiere el header If-Match.
              requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
    BranchCodeTaken:
      description: El código de sucursal ya existe
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BRANCH_CODE_TAKEN
              message: Ya existe una sucursal con ese código.
              requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
    BranchStateConflict:
      description: Versión obsoleta o sucursal con operación activa
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            versionConflict:
              value:
                error:
                  code: VERSION_CONFLICT
                  message: El recurso fue modificado por otra operación.
                  details:
                    expectedVersion: 8
                    currentVersion: 9
                  requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
            activeOperations:
              value:
                error:
                  code: BRANCH_HAS_ACTIVE_OPERATIONS
                  message: La sucursal tiene operaciones activas.
                  details:
                    activeTableSessions: 2
                    openCashShifts: 1
                    unknownPayments: 0
                    unknownInvoices: 0
                    upcomingReservations: 4
                  requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
    TableConflict:
      description: Conflicto con la mesa
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            VERSION_CONFLICT:
              value:
                error:
                  code: VERSION_CONFLICT
                  message: El recurso fue modificado por otra operación.
                  requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
            TABLE_NUMBER_TAKEN:
              value:
                error:
                  code: TABLE_NUMBER_TAKEN
                  message: Ya existe una mesa con ese número.
                  requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
            TABLE_ALREADY_ASSIGNED:
              value:
                error:
                  code: TABLE_ALREADY_ASSIGNED
                  message: La mesa tiene una sesión activa.
                  requestId: 0b3c1f6e-8f7a-4a51-9a3e-2d1c7e5b9a10
            BRANCH_INACTIVE:
              value:
                error:
