  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    Pagination:
      type: object
      required:
      - page
      - perPage
      - total
      - lastPage
      properties:
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        lastPage:
          type: integer
          minimum: 1
    Meta:
      type: object
      properties:
        requestId:
          $ref: '#/components/schemas/Uuid'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            requestId:
              $ref: '#/components/schemas/Uuid'
    AuthSessionStatus:
      type: string
      enum:
      - ACTIVE
      - REVOKED
      - EXPIRED
    DeviceStatus:
      type: string
      enum:
      - ACTIVE
      - BLOCKED
      - RETIRED
    WebLoginRequest:
      type: object
      required:
      - email
      - password
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 1024
    MobileLoginRequest:
      type: object
      required:
      - email
      - password
      - deviceUuid
      - deviceCredential
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 1024
        deviceUuid:
          $ref: '#/components/schemas/Uuid'
        deviceCredential:
          type: string
          writeOnly: true
          minLength: 32
          maxLength: 256
    MobileRefreshRequest:
      type: object
      required:
      - deviceUuid
      - refreshToken
      additionalProperties: false
      properties:
        deviceUuid:
          $ref: '#/components/schemas/Uuid'
        refreshToken:
          type: string
          writeOnly: true
          minLength: 32
          maxLength: 512
    DeviceEnrollRequest:
      type: object
      required:
      - code
      - deviceUuid
      - displayName
      additionalProperties: false
      properties:
        code:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 32
        deviceUuid:
          $ref: '#/components/schemas/Uuid'
        displayName:
          type: string
          minLength: 1
          maxLength: 80
    ReasonRequest:
      type: object
      required:
      - reason
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
    Device:
      type: object
      required:
      - id
      - branchId
      - type
      - status
      - displayName
      - enrolledAt
      - version
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        branchId:
          type: string
          format: uuid
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type:
          type: string
          enum:
          - ANDROID
        status:
          $ref: '#/components/schemas/DeviceStatus'
        displayName:
          type: string
        enrolledAt:
          $ref: '#/components/schemas/Timestamp'
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          minimum: 1
    AuthSession:
      type: object
      required:
      - id
      - clientType
      - status
      - current
      - createdAt
      - lastActivityAt
      - absoluteExpiresAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        clientType:
          type: string
          enum:
          - ANDROID
          - WEB
        status:
          $ref: '#/components/schemas/AuthSessionStatus'
        current:
          type: boolean
          description: Indica si es la sesión que hizo esta petición
        deviceId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastActivityAt:
          $ref: '#/components/schemas/Timestamp'
        absoluteExpiresAt:
          $ref: '#/components/schemas/Timestamp'
        revokedAt:
          type: string
          format: date-time
          nullable: true
    Membership:
      type: object
      required:
      - branch
      - role
      - permissions
      properties:
        branch:
          type: object
          required:
          - id
          - name
          properties:
            id:
              type: string
              format: uuid
              example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            name:
              type: string
              example: Sucursal de ejemplo
        role:
          type: string
          enum:
          - ADMIN
          - MANAGER
          - WAITER
          - KITCHEN
          example: WAITER
        permissions:
          type: array
          items:
            type: string
          example:
          - tables.read
          - table_sessions.open
          - orders.create
          - orders.read
          - order_units.deliver
    AuthMeResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - user
          - memberships
          - session
          properties:
            user:
              type: object
              required:
              - id
              - name
              - email
              properties:
                id:
                  $ref: '#/components/schemas/Uuid'
                name:
                  type: string
                  example: Empleado de ejemplo
                email:
                  type: string
                  format: email
                  example: empleado@ejemplo.mx
            memberships:
              type: array
              items:
                $ref: '#/components/schemas/Membership'
            session:
              $ref: '#/components/schemas/AuthSession'
        meta:
          $ref: '#/components/schemas/Meta'
    MobileTokenResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - session
          - accessToken
          - accessTokenExpiresIn
          - refreshToken
          - refreshTokenExpiresAt
          properties:
            session:
              type: object
              required:
              - id
              - absoluteExpiresAt
              properties:
                id:
                  $ref: '#/components/schemas/Uuid'
                absoluteExpiresAt:
                  $ref: '#/components/schemas/Timestamp'
            accessToken:
              type: string
              example: ejemplo-access-token-0123456789abcdef
            accessTokenExpiresIn:
              type: integer
              minimum: 1
              description: Segundos de vigencia
            refreshToken:
              type: string
              example: ejemplo-refresh-token-0123456789abcdef0123456789
            refreshTokenExpiresAt:
              $ref: '#/components/schemas/Timestamp'
        meta:
          $ref: '#/components/schemas/Meta'
    DeviceEnrollResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - device
          - deviceCredential
          properties:
            device:
              $ref: '#/components/schemas/Device'
            deviceCredential:
              type: string
              description: Se devuelve una sola vez
              example: ejemplo-credencial-de-dispositivo-0123456789abcdef
        meta:
          $ref: '#/components/schemas/Meta'
    EnrollmentCodeResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - code
          - expiresAt
          properties:
            code:
              type: string
              description: Se devuelve una sola vez
            expiresAt:
              $ref: '#/components/schemas/Timestamp'
        meta:
          $ref: '#/components/schemas/Meta'
    AuthSessionListResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuthSession'
        meta:
          $ref: '#/components/schemas/Meta'
    DeviceListResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        meta:
          $ref: '#/components/schemas/Meta'
    BranchStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    BranchAddress:
      type: object
      required:
      - line1
      - city
      - state
      - postalCode
      - country
      additionalProperties: false
      properties:
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          nullable: true
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          minLength: 1
          maxLength: 100
        postalCode:
          type: string
          minLength: 1
          maxLength: 16
        country:
          type: string
          pattern: ^[A-Z]{2}$
    Branch:
      type: object
      required:
      - id
      - code
      - name
      - status
      - timezone
      - currency
      - businessDayCutoff
      - createdAt
      - updatedAt
      - version
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/BranchStatus'
        timezone:
          type: string
          description: Zona horaria IANA
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        businessDayCutoff:
          type: string
